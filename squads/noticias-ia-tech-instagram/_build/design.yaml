# Design output — notícias IA/tech → Instagram feed (carrossel)
# Atualizado: designer verifica notícia capturada antes de gerar imagens profissionais.
#
# NOTA: O fluxo canónico em produção está em pipeline/pipeline.yaml: copywriter → strategist →
# designer (IA + compose-carousel-slides.py). Secções "creator" abaixo são legado (ângulos + instagram-draft).

squad:
  code: "noticias-ia-tech-instagram"
  name: "Notícias IA & Tech — Instagram"
  description: "Curadoria diária de notícias, carrossel Instagram com verificação factual no design visual e entrega para validação do gestor."

agents:
  - id: "researcher"
    name: "Pedro Pesquisa"
    title: "Pesquisador & curador de notícias"
    icon: "📡"
    execution: "subagent"
    role_summary: "Encontra e ranqueia notícias de IA e tecnologia em fontes públicas conforme o foco do dia; não inventa ângulos — só material-fonte."
    skills: []
    tasks:
      - name: "find-and-rank-news"
        file: "tasks/find-and-rank-news.md"
        description: "Pesquisa web focada, lista 3–8 histórias com título, fonte, data, link, resumo e relevância para o público misto."
    artifacts:
      operational_framework: |
        1) Ler research-focus.md (tema + janela temporal).
        2) Mapear categorias de fontes (imprensa tech, blogs, anúncios oficiais).
        3) Recolher 5–10 candidatos; descartar duplicados e baixa confiança.
        4) Ranquear por frescor, credibilidade e encaixe no foco.
        5) Produzir ranked-news.md com tabela e links; marcar confiança por item.
      output_examples: []
      anti_patterns:
        never_do:
          - "Misturar ângulo editorial com o papel de pesquisador (ângulos são do criador)."
        always_do:
          - "Citar URL e data de cada notícia."
      voice_guidance:
        always_use: []
        never_use: []
        tone_rules:
          - "Tom neutro e factual; sem hype emocional."
      quality_criteria:
        - "Cada item listado tem fonte e data acessível."

  - id: "creator"
    name: "Guilherme Gancho"
    title: "Criador de conteúdo Instagram (feed)"
    icon: "✍️"
    execution: "inline"
    role_summary: "A partir da notícia escolhida: gera 5 ângulos distintos; depois legenda + estrutura de carrossel (slides) em formato instagram-feed."
    skills: []
    tasks:
      - name: "generate-angles"
        file: "tasks/generate-angles.md"
        description: "Cinco ângulos distintos sobre a notícia selecionada (medo, oportunidade, educacional, etc.)."
      - name: "create-instagram-feed"
        file: "tasks/create-instagram-feed.md"
        description: "Legenda, keywords, hashtags, roteiro slide-a-slide com headlines e apoios; pronto para aprovação visual."
    artifacts:
      operational_framework: |
        1) Ler notícia selecionada (uma só).
        2) Gerar 5 ângulos; aguardar escolha do utilizador.
        3) Produzir copy Instagram: hook, corpo, CTA institucional; 5–15 hashtags relevantes.
        4) Estruturar carrossel (capa + corpo + CTA) com limites de palavras por slide.
      output_examples: []
      anti_patterns:
        never_do:
          - "Inventar dados que não estejam na notícia ou nas fontes."
        always_do:
          - "Manter tom profissional/institucional."
      voice_guidance:
        always_use: []
        never_use: []
        tone_rules:
          - "pt-BR; clareza e autoridade."
      quality_criteria:
        - "Legenda e slides coerentes com a notícia escolhida."

  - id: "designer"
    name: "Diana Diapositivo"
    title: "Designer de carrossel & verificação da notícia"
    icon: "🎨"
    execution: "subagent"
    role_summary: "Verifica a notícia capturada (fonte, datas, fatos centrais) contra o texto aprovado e o brief; só em caso de alinhamento gera imagens de carrossel profissionais."
    skills:
      - "image-creator"
      - "template-designer"
      - "image-ai-generator"
    tasks:
      - name: "verify-news-for-visuals"
        file: "tasks/verify-news-for-visuals.md"
        description: "Confirma que a notícia em ranked-news/selected-story corresponde ao pacote aprovado (sem deriva); regista verificação em output/verification-news.md."
      - name: "generate-professional-carousel"
        file: "tasks/generate-professional-carousel.md"
        description: "Gera slides 1080x1440 (3:4), tipografia hierárquica, marca quando existir; export pronto para revisão."
    artifacts:
      operational_framework: |
        1) Carregar notícia selecionada, copy aprovado e research-brief.
        2) Comparar titular, fatos, datas e URL; se houver divergência, bloquear e reportar no ficheiro de verificação.
        3) Só após PASS na verificação: aplicar image-design + instagram-feed (visual).
        4) Gerar carrossel profissional (cores alternadas, capa de alto impacto, créditos de fonte no último slide).
        5) Exportar assets em output/ para o gestor.
      output_examples: []
      anti_patterns:
        never_do:
          - "Gerar imagens antes de confirmar alinhamento factual com a notícia capturada."
          - "Ilustrar dados ou estatísticas não presentes na notícia ou no copy aprovado."
        always_do:
          - "Documentar PASS/FAIL da verificação antes de qualquer geração visual."
      voice_guidance:
        always_use: []
        never_use: []
        tone_rules:
          - "Visual institucional, legível, sem poluição; créditos de fonte visíveis."
      quality_criteria:
        - "verification-news.md existe com resultado explícito antes de generate-professional-carousel."
        - "Slides com proporção e densidade de texto conforme instagram-feed.md."

  - id: "reviewer"
    name: "Vera Veredito"
    title: "Revisora de qualidade"
    icon: "✅"
    execution: "inline"
    role_summary: "Avalia factualidade, tom, formato Instagram e pacote final (texto + imagens) para aprovação do gestor."
    skills: []
    tasks:
      - name: "review"
        file: "tasks/review.md"
        description: "Veredito APPROVE/REJECT com critérios de rubrica; feedback acionável."
    artifacts:
      operational_framework: |
        1) Carregar quality-criteria e outputs finais.
        2) Pontuar por critério; aplicar regras de hard reject.
        3) Entregar veredito estruturado.
      output_examples: []
      anti_patterns:
        never_do:
          - "Aprovar sem confirmar que a verificação do designer foi PASS."
        always_do:
          - "Referir a verification-news.md na revisão quando existir."
      voice_guidance:
        always_use: []
        never_use: []
        tone_rules: []
      quality_criteria:
        - "Veredito final alinhado a review.md."

pipeline:
  - step: 1
    name: "checkpoint-research-focus"
    type: "checkpoint"
    output_file: "squads/noticias-ia-tech-instagram/output/research-focus.md"

  - step: 2
    name: "find-and-rank-news"
    type: "agent"
    agent: "researcher"
    execution: "subagent"
    model_tier: "fast"
    input_file: "squads/noticias-ia-tech-instagram/output/research-focus.md"
    output_file: "squads/noticias-ia-tech-instagram/output/ranked-news.md"

  - step: 3
    name: "checkpoint-select-news"
    type: "checkpoint"
    output_file: "squads/noticias-ia-tech-instagram/output/selected-story.md"

  - step: 4
    name: "generate-angles"
    type: "agent"
    agent: "creator"
    execution: "inline"
    format: "instagram-feed"
    input_file: "squads/noticias-ia-tech-instagram/output/selected-story.md"
    output_file: "squads/noticias-ia-tech-instagram/output/angles.md"

  - step: 5
    name: "checkpoint-select-angle"
    type: "checkpoint"
    output_file: "squads/noticias-ia-tech-instagram/output/selected-angle.md"

  - step: 6
    name: "create-instagram-feed"
    type: "agent"
    agent: "creator"
    execution: "inline"
    format: "instagram-feed"
    input_file: "squads/noticias-ia-tech-instagram/output/selected-angle.md"
    output_file: "squads/noticias-ia-tech-instagram/output/instagram-draft.md"

  - step: 7
    name: "checkpoint-approve-content"
    type: "checkpoint"
    output_file: "squads/noticias-ia-tech-instagram/output/content-approved.md"

  - step: 8
    name: "verify-news-for-visuals"
    type: "agent"
    agent: "designer"
    execution: "subagent"
    model_tier: "fast"
    input_file: "squads/noticias-ia-tech-instagram/output/content-approved.md"
    output_file: "squads/noticias-ia-tech-instagram/output/verification-news.md"

  - step: 9
    name: "generate-professional-carousel"
    type: "agent"
    agent: "designer"
    execution: "subagent"
    model_tier: "fast"
    format: "instagram-feed"
    input_file: "squads/noticias-ia-tech-instagram/output/verification-news.md"
    output_file: "squads/noticias-ia-tech-instagram/output/carousel-package/"

  - step: 10
    name: "review"
    type: "agent"
    agent: "reviewer"
    execution: "inline"
    input_file: "squads/noticias-ia-tech-instagram/output/carousel-package/"
    on_reject: 6

  - step: 11
    name: "checkpoint-final-manager"
    type: "checkpoint"
    output_file: "squads/noticias-ia-tech-instagram/output/ready-for-posting.md"

investigation:
  enriched: false

research_brief: |
  Ver pipeline/data/research-brief.md — curadoria em camadas, fontes antes de volume;
  designer deve verificar notícia capturada antes de gerar imagens profissionais.

skills_installed:
  - "web_search"
  - "web_fetch"
  - "image-creator"
  - "image-ai-generator"
  - "template-designer"

formats_selected:
  - "instagram-feed"

best_practices_consulted:
  - "researching.md"
  - "instagram-feed.md"
  - "copywriting.md"
  - "review.md"
  - "image-design.md"

template_selection: "skipped"

designer_news_verification:
  enabled: true
  description: "O agente Diana Diapositivo executa verify-news-for-visuals antes de generate-professional-carousel; falha bloqueia geração de imagens até correção."
