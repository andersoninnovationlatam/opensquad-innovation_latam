squad_code: "noticias-ia-tech-instagram"
purpose: |
  Identificar notícias sobre IA e tecnologia diariamente; estruturar conteúdo no formato e estilo Instagram;
  capturar palavras-chave e hashtags mais usadas; criar carrossel de imagens para post no Instagram com textos
  e imagens profissionais. Posts prontos para validação do gestor; o gestor publica manualmente.
  Papéis desejados no desenho do squad: estrategista digital, curador/analista de tendências, copywriter,
  designer de social media (publicação automática fora de escopo — apenas aprovação + post manual).

domain: "mixed"

company:
  name: "[Configurar em _opensquad/_memory/company.md]"
  tone: "[Configurar em _opensquad/_memory/company.md]"
  products: "[Configurar em _opensquad/_memory/company.md]"

language: "pt-BR"

context:
  audience: "Clientes atuais, potenciais leads e público geral (audiência mista)."
  platforms: "Instagram — apenas feed (carrosséis e posts de feed)."
  tone: "Profissional / institucional."
  sources: "Sites públicos: media tech, blogs, imprensa."
  output_format: "Pacote diário: tema da notícia, palavras-chave, hashtags, legenda e carrossel (slides) prontos para revisão."
  frequency: "Diária (monitorização e produção orientadas ao dia)."
  trigger: "Execução sob demanda ou agendada (pipeline diário) — a definir no design."
  systems: "Skills do repositório (apify, geração/arte de imagem, templates); publicação final manual pelo gestor."
  data_sources: "Notícias web públicas sobre IA e tecnologia."
  decisions: "Quais notícias viram post; alinhamento de tom e marca antes de publicar."
  designer_requirements: |
    O agente de design de imagens deve confirmar a notícia capturada (fonte, data, fatos centrais)
    face ao texto aprovado e ao brief de pesquisa antes de gerar qualquer slide; só então produz
    imagens profissionais (carrossel) alinhadas ao tom institucional.

tools_needed:
  - "apify"
  - "image-creator"
  - "image-ai-generator"
  - "template-designer"
  - "image-fetcher"
  - "blotato"
  - "instagram-publisher"

investigation:
  enabled: false
  profiles: []

target_formats:
  - "instagram-feed"
