name: "Pipeline — Social Media Innovation Latam v3"
version: "2.0.0"
squad: "agent-social-v3"

description: >
  Pipeline 100% OpenRouter: input/content.md (notícia + angulo_escolhido obrigatório) →
  [OPENROUTER_MODELS_CONTENT] angles.yaml + carousel-draft.md (generate-content.mjs) →
  [OPENROUTER_MODELS_CONTENT] brand-assets.md referências visuais de marca (research-brand-assets.mjs) →
  [OPENROUTER_MODELS_CONTENT] slide-scenes.md direção de arte com brand context (generate-scenes.mjs) →
  [OPENROUTER_MODELS_CONTENT] 6× slide HTML (generate-html.mjs) →
  [OPENROUTER_MODELS_IMAGE] fundos fotográficos + inject + JPEG 1080×1350 (run-squad-design.mjs) →
  [REVISÃO] Rafael Revisor avalia conexão copy-visual + qualidade + identidade → art-review.md →
  upload Google Drive + notificação Google Chat. Sem checkpoints obrigatórios.

steps:
  - id: step-00
    name: "Geração de Conteúdo via OpenRouter (OPENROUTER_MODELS_CONTENT)"
    type: script
    execution: script
    script: "node squads/agent-social-v3/scripts/generate-content.mjs {run_id}"
    file: steps/step-00-generate-content.md

  - id: step-01
    name: "Pesquisa de Marcas e Ativos Visuais — Leo Logos"
    type: script
    execution: script
    script: "node squads/agent-social-v3/scripts/research-brand-assets.mjs {run_id}"
    file: steps/step-01-brand-research.md
    depends_on: step-00

  - id: step-03
    name: "Direção de Arte via OpenRouter (OPENROUTER_MODELS_CONTENT)"
    type: script
    execution: script
    script: "node squads/agent-social-v3/scripts/generate-scenes.mjs {run_id}"
    file: steps/step-03-art-direction.md
    depends_on: step-01

  - id: step-04
    name: "Design HTML dos Slides via OpenRouter (OPENROUTER_MODELS_CONTENT)"
    type: script
    execution: script
    script: "node squads/agent-social-v3/scripts/generate-html.mjs {run_id}"
    file: steps/step-04-design-slides.md
    depends_on: step-03

  - id: step-05
    name: "Render — Fundos via OpenRouter (OPENROUTER_MODELS_IMAGE) + JPEG"
    type: script
    execution: script
    script: "node squads/agent-social-v3/scripts/run-squad-design.mjs {run_id}"
    file: steps/step-05-render-slides.md
    depends_on: step-04

  - id: step-05b
    name: "Revisão de Arte — Rafael Revisor"
    type: agent
    agent: rafael-revisor
    execution: inline
    file: steps/step-05b-review-art.md
    depends_on: step-05
    checkpoint: false

  - id: step-06
    name: "Upload dos Slides para Google Drive"
    type: agent
    agent: daria-design
    execution: inline
    file: steps/step-06-notify-google-chat.md
    depends_on: step-05b
    checkpoint: false

output:
  artifacts:
    - output/angles.yaml
    - output/carousel-draft.md
    - output/brand-assets.md
    - output/slide-scenes.md
    - output/slides/
    - output/slides/rendered/
    - output/art-review.md
    - output/drive-upload-result.md
