investigation:
  enriched: false

research_brief: |
  ## Instagram Carrossel — Innovation Latam: Brief de Pesquisa Consolidado

  ### Domínio: Conteúdo para Instagram (Carrossel)

  **Frameworks operacionais identificados:**
  - Estrutura editorial do squad instagram-carrossel (validado em produção): hook âncora →
    conteúdo sequencial (1 ideia/slide) → reflexão emocional → CTA duplo.
  - Padrão post-05 do squad tech-instagram-carousel: slide-titulo (capa) + slide-conteudo-imagem
    (slide 2 com imagem full-bleed) + slides roxo sólido (#150a1c→#2a1538) para demais.
  - Sistema de ângulos virais: Medo / Oportunidade / Educacional / Contrário / Inspiracional.
  - Algoritmo Instagram: Saves > Shares > Comments > Likes. Carrosséis recebem ~1.4× mais
    alcance que imagens únicas. Algoritmo re-serve carrosséis não vistos.

  **Benchmarks de qualidade validados:**
  - C1 Scroll-Stop Test (peso 1.5×): slide 1 para qualquer scroll sem esforço
  - C2 Data Integrity: toda afirmação factual com fonte e número específico
  - C3 Story Coherence: cada slide consequência do anterior
  - C4 Reflexão Final: síntese emocional antes do CTA
  - C5 CTA Specificity: duas ações (salvar + comentar), conectadas ao tema
  - C6 Brand Voice: tom didático-revelador, não corporativo

  **Anti-patterns críticos (validados em campo):**
  - Slide 1 começando com nome da marca ou apresentação → destruição do scroll-stop
  - Afirmações factuais sem dado ou fonte → falha editorial que o leitor percebe
  - Mais de 5 linhas visíveis por slide → abandon rate mobile
  - Todos os slides com mesmo layout → ritmo monótono
  - CTA genérico ("nos siga para mais") → engajamento mínimo
  - Texto abaixo de 28px corpo → ilegível em mobile

  **Identidade visual Innovation Latam (padrão post-05 — obrigatório):**
  - Fonte: Montserrat exclusivamente (Google Fonts @import)
  - Slide 1: fundo escuro + gradiente, hero text 82px Bold, letter-spacing -0.02em
  - Slide 2: imagem full-bleed + overlay rgba(21,10,28,0.75-0.95), headline 46px, body 36px
  - Slides 3+: roxo sólido #150a1c→#2a1538, body 40px Medium, destaques #c0fefd
  - Logo: branco, canto superior esquerdo, max-width 200px, margem 30px, via data-URI
  - Rodapé: @innovationlatam esquerda | ARRASTE → direita

  **Vocabulário do domínio — sempre usar:**
  - "Dado-âncora" — número mais forte para o hook
  - "Ângulo viral" — lente emocional única para contar o mesmo conteúdo
  - "Slide de reflexão" — síntese emocional penúltima
  - "Hook" — primeira linha que para o scroll
  - "Tokens de design" — variáveis do sistema visual (cores, fontes, espaçamentos)

  **Vocabulário — nunca usar:**
  - "Incrível", "fantástico" — vazios, substituir por dado específico
  - "Disruptivo", "game-changer" — jargão de marketing
  - "Neste carrossel vou te mostrar..." — meta-comentário que desperdiça slide 1

