squad_code: "agent-social-v3"
purpose: >
  Produção automatizada de carrosséis Instagram da Innovation Latam — da entrada de
  conteúdo (input/) até slides PNG renderizados. Combina o pipeline editorial detalhado
  do squad instagram-carrossel (estrutura de slides, ritmo visual, CTA) com a identidade
  visual consolidada do squad tech-instagram-carousel (padrão post-05: Montserrat,
  paleta roxa, logo branco, build-carousel-slides.mjs).
domain: "content"

company:
  name: "Innovation Latam"
  tone: "Profissional, acessível e educativo — com energia empreendedora"
  products: >
    Marketplace B2B de inovação corporativa, plataforma de gestão de programas de
    inovação, Hub IA4FIN, Robot Rock (IA), blog e newsletter de inovação

language: "pt-BR"

context:
  audience: "Grandes empresas e profissionais de inovação corporativa; interessados em startups, IA e tendências de mercado"
  platforms: "Instagram Feed (Carrossel)"
  tone: "Profissional, acessível e educativo — energia empreendedora (padrão Innovation Latam)"
  input_method: "Texto ou notícia colocado em input/ pelo usuário"
  checkpoints: "Nenhum checkpoint humano obrigatório — pipeline full-auto por padrão"

reference_squads:
  editorial_reference: "temp/squads/instagram-carrossel"
  visual_reference: "squads/tech-instagram-carousel"

editorial_rules:
  slide_structure:
    - "Slide 1: Hook com dado âncora forte"
    - "Slides intermediários: uma ideia principal por slide; máx 4–5 linhas visíveis; ritmo visual variado (não repetir o mesmo layout)"
    - "Sem repetir informação entre slides; slides conectados em sequência lógica"
    - "Penúltimo: slide de reflexão (síntese emocional — não dado novo); tratamento visual distinto"
    - "Último: CTA com duas ações claras (salvar + comentar); tratamento visual distinto"
  design_rules:
    - "HTML auto-suficiente por slide com CSS inline"
    - "WCAG AA mínimo (contraste 4.5:1)"
    - "Sem overflow de texto; corpo mínimo ~28px (compatível com o padrão 36–40px do visual-identity)"
    - "Mesmo design system (tokens) em todos os slides"
    - "Variação de composição entre slides de conteúdo, mantendo consistência de marca"

visual_identity:
  source: "squads/tech-instagram-carousel/pipeline/data/visual-identity.md"
  pattern: "post-05 (padrão obrigatório)"
  priority: "Identidade visual do tech-instagram-carousel tem prioridade sobre qualquer layout variado"
  conflict_resolution: >
    Variação de layout (ritmo visual entre slides) é implementada como extensões
    explícitas dentro dos tokens do tech-instagram-carousel, documentadas em
    pipeline/data/layout-variations.md
  tokens:
    typography: "Montserrat exclusivamente (Google Fonts)"
    palette_bg: "#150a1c → #2a1538"
    palette_highlight_teal: "#c0fefd"
    palette_highlight_gold: "#e8c85c"
    palette_institutional: "#993CB1"
    logo: "branco, canto superior esquerdo, max-width 200px, margem 30px — todos os slides"
    footer: "@innovationlatam esquerda | ARRASTE → direita"
  build_script: "squads/tech-instagram-carousel/scripts/build-carousel-slides.mjs"
  assets:
    - "squads/tech-instagram-carousel/assets/innovation-latam-logo-white.png"
    - "squads/tech-instagram-carousel/assets/ai-brain-glow.png"

tools_needed:
  - "web_search"
  - "web_fetch"
  - "nodejs_playwright"

investigation:
  enabled: false

target_formats:
  - "instagram-feed"
