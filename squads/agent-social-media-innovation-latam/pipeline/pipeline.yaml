name: "Pipeline — Social Media Innovation Latam"
version: "1.0.0"
squad: "agent-social-media-innovation-latam"

description: >
  Pipeline full-auto: input/content.md (notícia + angulo_escolhido obrigatório) → pesquisa enriquecida → angles.yaml + copy → design HTML → render PNG → revisão.
  Sem checkpoints obrigatórios. Para adicionar checkpoints: /opensquad edit agent-social-media-innovation-latam.

steps:
  - id: step-01
    name: "Pesquisa e Enriquecimento"
    type: agent
    agent: rafael-rastreio
    execution: subagent
    file: steps/step-01-research-enrich.md

  - id: step-02
    name: "Registro de Ângulos (ângulo do usuário)"
    type: agent
    agent: carlos-conteudo
    execution: inline
    file: steps/step-02-generate-angles.md
    depends_on: step-01

  - id: step-03
    name: "Criação dos Slides (Copy)"
    type: agent
    agent: carlos-conteudo
    execution: inline
    file: steps/step-03-create-slides.md
    depends_on: step-02

  - id: step-04
    name: "Design dos Slides (HTML)"
    type: agent
    agent: daria-design
    execution: inline
    file: steps/step-04-design-slides.md
    depends_on: step-03

  - id: step-05
    name: "Renderização dos Slides (PNG)"
    type: agent
    agent: daria-design
    execution: inline
    file: steps/step-05-render-slides.md
    depends_on: step-04

  - id: step-06
    name: "Revisão de Qualidade"
    type: agent
    agent: beatriz-balizadora
    execution: inline
    file: steps/step-06-review.md
    depends_on: step-05
    on_reject: step-03

output:
  artifacts:
    - output/research.md
    - output/angles.yaml
    - output/carousel-draft.md
    - output/slides/
    - output/slides/rendered/
    - output/review.md
