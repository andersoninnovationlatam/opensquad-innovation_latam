<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1440">
  <title>Template C: Number Focus — Reference Implementation</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 1080px;
      height: 1440px;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      padding: 72px;
    }
    
    /* Header Tag Component */
    .header-tag {
      background: #FFD70033;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 24px;
      color: #FFD700;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 64px;
      display: inline-block;
      align-self: flex-start;
    }
    
    /* Stat Layout (Big Number + Headline) */
    .stat-layout {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 32px;
    }
    
    .big-number {
      font-size: 180px;
      font-weight: 900;
      color: #FFD700;
      line-height: 0.85;
      flex-shrink: 0;
    }
    
    .headline {
      font-size: 58px;
      font-weight: 700;
      color: #fff;
      line-height: 1.15;
      padding-top: 20px;
    }
    
    /* Accent Line */
    .accent-line {
      width: 100px;
      height: 4px;
      background: #FFD700;
      margin-bottom: 32px;
    }
    
    /* Body Text */
    .body-text {
      font-size: 34px;
      font-weight: 500;
      color: #aaa;
      line-height: 1.6;
    }
    
    /* Keyword Emphasis */
    .highlight {
      color: #FFD700;
    }
    
    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-top: 32px;
      border-top: 1px solid #333;
      margin-top: auto;
    }
    
    .footer .brand {
      font-size: 24px;
      color: #888;
      font-weight: 600;
    }
    
    .footer .swipe {
      margin-left: auto;
      font-size: 24px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- Pattern 1: Stat Layout (Big Number + Headline) -->
  <div class="header-tag">TECH INSIGHT #3</div>
  
  <div class="stat-layout">
    <div class="big-number">67%</div>
    <div class="headline">mais produtividade com IA</div>
  </div>
  
  <div class="accent-line"></div>
  
  <div class="body-text">
    pesquisa com 10 mil desenvolvedores mostra que usar assistentes de IA reduziu tempo em tarefas repetitivas em dois terços. o segredo não é qual ferramenta você usa. é <span class="highlight">como você integra</span> ela no seu workflow.
  </div>
  
  <div class="footer">
    <div class="brand">Innovation Latam</div>
    <div class="swipe">ARRASTE →</div>
  </div>
</body>
</html>
