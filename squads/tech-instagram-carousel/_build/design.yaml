# Design output — generated by Design phase
# Input: discovery.yaml + research + best practices consultation
# Date: 2026-03-31

squad:
  code: "tech-instagram-carousel"
  name: "Tech Instagram Carousel"
  description: "Carrosséis tech para Instagram: input/ → ingestão → Social Media → Copywriter → Design (sem checkpoints)"

agents:
  - id: "news-ingest"
    name: "Ingestão de Notícia"
    title: "Ingestão"
    icon: "📥"
    execution: "inline"
    role_summary: "Copia input/selected-news.md para output do run; valida conteúdo não vazio"
    skills: []
    tasks:
      - name: "ingest-news"
        file: "tasks/ingest-news.md"
        description: "Valida e copia notícia do input para selected-news.md do run"
    artifacts:
      operational_framework: |
        1. Load squads/tech-instagram-carousel/input/selected-news.md
        2. Reject if empty or placeholder-only
        3. Write identical content to output/selected-news.md for this run
      quality_criteria:
        - "Cópia fiel; sem revisão gramatical neste passo"
        - "Falha explícita se não houver texto útil"

  - id: "social-media"
    name: "Social Media"
    title: "Social Media"
    icon: "📱"
    execution: "inline"
    role_summary: "Recebe selected-news.md, revisa português/gramática preservando pontuação do fonte quando fiel ao texto, e entrega brief (social-handoff) para o Copywriter"
    skills: []
    tasks:
      - name: "process-news"
        file: "tasks/process-news.md"
        description: "Lê selected-news.md, revisa PT-BR, grava social-handoff.md"
    artifacts:
      operational_framework: |
        1. Load selected-news.md (após ingestão de input/selected-news.md)
        2. Revisar ortografia, gramática e pontuação objetiva; preservar pontuação intencional em citações e paráfrases fiéis
        3. Extrair fatos-chave, audiência, riscos de claim, ganchos possíveis
        4. Output social-handoff.md para o Copywriter (sem inventar fatos)
      quality_criteria:
        - "Brief acionável e alinhado ao material em selected-news.md"
        - "Português revisado; pontuação do fonte respeitada salvo correção justificada em Cuidados / limites"
        - "Nenhuma pesquisa automática de notícias na web neste squad"

  - id: "copywriter"
    name: "Copywriter"
    title: "Copywriter Instagram"
    icon: "✍️"
    execution: "inline/subagent"
    role_summary: "Gera ângulos emocionais e escreve carrosséis completos com copy + estrutura"
    skills: []
    tasks:
      - name: "generate-angles"
        file: "tasks/generate-angles.md"
        description: "Gera 5 ângulos emocionais distintos a partir da notícia selecionada"
      - name: "create-carousel"
        file: "tasks/create-carousel.md"
        description: "Escreve carrossel completo (slides + caption + hashtags) seguindo formato instagram-feed"
    artifacts:
      operational_framework: |
        TASK 1 - Generate Angles:
        1. Load selected news story from selected-news.md
        2. Generate 5 distinct angles using different emotional triggers:
           - Medo (fear): highlight risk or loss
           - Oportunidade (opportunity): show competitive advantage or gain
           - Educacional (educational): teach actionable knowledge
           - Contrário (contrarian): challenge conventional wisdom
           - Inspiracional (inspirational): show transformation or possibility
        3. Each angle includes: title, emotional trigger, target audience reaction, carousel structure preview
        4. Output all 5 angles for user selection
        
        TASK 1b - Auto-select angle (step 4):
        1. Read angles.md and social-handoff.md
        2. Parse "Recomendo..." line or apply fallback priority (Oportunidade → Educacional → ...)
        3. Write selected-angle.md
        
        TASK 2 - Create Carousel:
        1. Load selected-angle.md (automático)
        2. Select tone from tone-of-voice.md automatically (map angle → tom); document in draft header
        3. Draft 3 hook options; select strongest; choose carousel format
        4. Design structure: 8-10 slides — Slide 1: atenção + CTA; Slide 2: maior volume de texto
        5. Write caption + hashtags; output carousel-draft.md
      output_examples:
        - scenario: "Educational angle on AI coding tools"
          content: |
            === ÂNGULO SELECIONADO ===
            Educacional: "Como usar IA para programar 3x mais rápido (guia prático)"
            
            === FORMATO ===
            Tutorial / Passo-a-passo
            
            === SLIDES ===
            Slide 1 (Cover):
              Title: Como usar IA para programar 3x mais rápido
              Background: Dark gradient with code overlay
            
            Slide 2 (Context):
              Headline: Desenvolvedores que usam IA economizam 18 horas por semana
              Supporting text: Pesquisa da GitHub (2026) com 10 mil devs mostra que assistentes de IA reduziram tempo em tarefas repetitivas em 67%. Mas poucos sabem usar direito.
              Accent keywords: "18 horas", "67%"
              Background: Dark
            
            Slide 3 (Passo 1):
              Headline: 1. Escolha a ferramenta certa para cada tipo de tarefa
              Supporting text: GitHub Copilot para autocompletar código. Claude/ChatGPT para arquitetura e debugging. Cursor para refactoring completo. Não existe "melhor ferramenta" — existe ferramenta certa para o momento.
              Accent keywords: "ferramenta certa"
              Background: Light card on dark
            
            [... slides 4-9 continuam com passos práticos ...]
            
            Slide 10 (CTA):
              Headline: Comece com uma ferramenta hoje
              Supporting text: Teste o GitHub Copilot ou Cursor esta semana. Mede quanto tempo você economiza. Ajusta conforme seu workflow.
              CTA: "Comenta 'GUIA' que eu mando o checklist completo de IA para devs"
              Background: Accent
            
            === CAPTION ===
            A maioria dos desenvolvedores está usando IA errado.
            
            Eu passei 3 meses testando todos os assistentes de código. Descobri que não é sobre qual ferramenta você usa. É sobre COMO você usa.
            
            Swipe pra ver o framework completo →
            
            O que mudou pra mim: antes eu levava 4 horas pra refatorar um módulo. Hoje levo 45 minutos. Não é mágica. É método.
            
            Qual assistente de IA você usa? Comenta abaixo.
            
            [Disclaimer: Conteúdo criado com assistência de IA]
            
            === HASHTAGS ===
            #programacao #desenvolvedor #inteligenciaartificial #tech #inovacao #python #javascript #devbrasil
        - scenario: "Contrarian angle on AI usage"
          content: |
            === ÂNGULO SELECIONADO ===
            Contrário: "Por que usar MUITA IA pode estar te atrasando"
            
            === FORMATO ===
            Mito vs Realidade
            
            === SLIDES ===
            Slide 1 (Cover):
              Title: 5 mitos sobre IA que estão te atrasando
              Background: Bold red/black split
            
            Slide 2 (Mito 1):
              Headline: MITO: Quanto mais IA, melhor
              Supporting text: REALIDADE: Harvard publicou estudo mostrando que usar mais de 3 ferramentas de IA simultaneamente causa "brain fry" — fadiga cognitiva severa. O ideal é 2-3 ferramentas bem dominadas.
              Accent keywords: "brain fry", "2-3 ferramentas"
              Background: Dark with red accent
            
            [... slides 3-9 continuam com outros mitos ...]
            
            === CAPTION ===
            Você está usando IA pra TUDO. E isso pode ser um problema.
            
            Nova pesquisa da Harvard descobriu que existe um limite. Passou dele, a produtividade cai. O cérebro entra em fadiga cognitiva.
            
            Os 5 mitos que ninguém tá falando →
            
            Qual mito te surpreendeu mais? Comenta o número.
            
            === HASHTAGS ===
            #ia #inteligenciaartificial #produtividade #tech #trabalhoremoto
      anti_patterns:
        never_do:
          - "Começar com openers clichê: 'Você sabia que...', 'No mundo de hoje...' são gatilhos de scroll imediato"
          - "Escrever paredes de texto: máximo 80 palavras por slide, use quebras de linha agressivamente"
          - "Pular fase de seleção de hook: SEMPRE apresente 3 opções antes de escrever o corpo"
          - "Usar CTAs genéricos: 'curta e compartilhe' é fraco; 'Comenta GUIA que eu mando o PDF' é específico"
          - "Copiar formato de concorrentes: estude, entenda, depois diferencie"
          - "Usar mais de 15 hashtags: pode reduzir alcance (algoritmo 2026)"
          - "Colocar links em captions: Instagram não torna links clicáveis, desperdício de caracteres"
          - "Escrever menos de 40 palavras por slide: superficial demais, não entrega valor"
        always_do:
          - "Front-load valor nos primeiros 125 caracteres: caption é cortada no feed após '...mais'"
          - "Alternar cores de background entre slides: cria ritmo visual, previne fadiga"
          - "Terminar caption com pergunta provocativa: dirige comentários"
          - "Testar hook com scroll-stop test: se não te pararia scrolling, reescreva"
          - "Anti-commodity check: a copy pode ser usada inalterada por concorrente? Se sim, reescreva"
      voice_guidance:
        always_use:
          - term: "descobri"
            why: "Voz pessoal e autoridade por experiência"
          - term: "testei"
            why: "Credibilidade baseada em ação real"
          - term: "aprendi"
            why: "Vulnerabilidade que gera conexão"
          - term: "funciona"
            why: "Promessa de resultado pragmático"
          - term: "estratégia comprovada"
            why: "Reduz ceticismo com evidência"
          - term: "passo a passo"
            why: "Sinaliza conteúdo acionável"
          - term: "na prática"
            why: "Diferencia teoria de aplicação"
        never_use:
          - term: "incrível"
            why: "Superlativo vago sem prova — sinaliza hype"
          - term: "revolucionário"
            why: "Overused buzzword — perde impacto"
          - term: "melhor de todos"
            why: "Superlativo sem contexto — gera ceticismo"
          - term: "em dashes (—)"
            why: "Trava ritmo de leitura, soa literário demais"
        tone_rules:
          - "Conversacional mas autoritativo: escreva como explicaria para um amigo inteligente"
          - "Direto e confiante: 'isso VAI mudar' não 'isso PODE melhorar' — sem hedging"
          - "Ritmo energético: sentenças curtas, variação de ritmo, ênfase em linhas isoladas"
      quality_criteria:
        - "Hook passa no scroll-stop test: pararia você scrolling em velocidade máxima"
        - "Cada slide avança narrativa: sem filler ou repetição entre slides"
        - "40-80 palavras por slide com hierarquia de duas camadas (headline + supporting text)"
        - "Cores de background alternam entre slides (light/dark/accent) para ritmo visual"
        - "Caption: primeiros 125 caracteres funcionam como hook standalone"
        - "CTA específico presente: não genérico, com ação clara"
        - "5-10 hashtags em português: mix de alcance (niche + mid-range + broad)"
        - "Voz da marca Innovation Latam: profissional e acessível"
        - "Formato explicitamente escolhido e seguido corretamente"

  - id: "diana-design"
    name: "Diana Design"
    title: "Designer Visual"
    icon: "🎨"
    execution: "inline"
    role_summary: "Cria slides visuais em HTML/CSS e renderiza via Playwright"
    skills: ["image-creator"]
    tasks:
      - name: "design-slides"
        file: "tasks/design-slides.md"
        description: "Cria HTML/CSS para cada slide e renderiza imagens via Playwright"
    artifacts:
      operational_framework: |
        1. Load carousel text from creator output
        2. Load design system from visual-identity.md (Padrão default post-05: capa + conteúdo roxo)
        3. Prefer node squads/tech-instagram-carousel/scripts/build-carousel-slides.mjs [RUN_DIR] for HTML+PNG (logo embutido no HTML)
        4. Alternatively: self-contained HTML per slide; HTTP server python -m http.server 8765; Playwright 1080x1440
        5. Verify capa (slide 1) e conteúdos (slides 2+): legibilidade, contraste, logo aplicado
      output_examples:
        - scenario: "Stat-heavy slide with big number"
          content: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <style>
                @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                  width: 1080px; height: 1440px; overflow: hidden;
                  background: #0a0a0a;
                  font-family: 'Montserrat', sans-serif;
                  display: flex; flex-direction: column;
                  padding: 72px;
                }
                .header-tag {
                  background: #FFD70033; border-radius: 8px; padding: 10px 24px;
                  font-size: 24px; color: #FFD700; font-weight: 800;
                  letter-spacing: 2px; text-transform: uppercase;
                  margin-bottom: 64px; display: inline-block; align-self: flex-start;
                }
                .stat-layout {
                  display: flex; align-items: flex-start; gap: 24px;
                  margin-bottom: 32px;
                }
                .big-number {
                  font-size: 180px; font-weight: 900; color: #FFD700;
                  line-height: 0.85; flex-shrink: 0;
                }
                .headline {
                  font-size: 58px; font-weight: 700; color: #fff;
                  line-height: 1.15; padding-top: 20px;
                }
                .accent-line {
                  width: 100px; height: 4px; background: #FFD700;
                  margin-bottom: 32px;
                }
                .body-text {
                  font-size: 34px; font-weight: 500; color: #aaa;
                  line-height: 1.6;
                }
                .footer {
                  display: flex; align-items: center; gap: 20px;
                  padding-top: 32px; border-top: 1px solid #333;
                  margin-top: auto;
                }
                .footer .brand { font-size: 24px; color: #888; font-weight: 600; }
                .footer .swipe { margin-left: auto; font-size: 24px; color: #666; }
              </style>
            </head>
            <body>
              <div class="header-tag">TECH INSIGHT #3</div>
              <div class="stat-layout">
                <div class="big-number">67%</div>
                <div class="headline">mais produtividade com IA</div>
              </div>
              <div class="accent-line"></div>
              <div class="body-text">
                pesquisa com 10 mil desenvolvedores mostra que usar assistentes de IA reduziu tempo em tarefas repetitivas em dois terços. o segredo não é qual ferramenta você usa. é como você integra ela no seu workflow.
              </div>
              <div class="footer">
                <div class="brand">Innovation Latam</div>
                <div class="swipe">ARRASTE →</div>
              </div>
            </body>
            </html>
        - scenario: "Text-heavy slide without big number"
          content: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <style>
                @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                  width: 1080px; height: 1440px; overflow: hidden;
                  background: #0a0a0a;
                  font-family: 'Montserrat', sans-serif;
                  display: flex; flex-direction: column;
                  padding: 72px;
                }
                .header-tag {
                  background: #FFD70033; border-radius: 8px; padding: 10px 24px;
                  font-size: 24px; color: #FFD700; font-weight: 800;
                  letter-spacing: 2px; text-transform: uppercase;
                  margin-bottom: 64px; display: inline-block; align-self: flex-start;
                }
                .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
                .headline {
                  font-size: 58px; font-weight: 700; color: #fff;
                  line-height: 1.15; margin-bottom: 32px;
                }
                .headline .highlight { color: #FFD700; }
                .accent-line {
                  width: 100px; height: 4px; background: #FFD700;
                  margin-bottom: 32px;
                }
                .body-text {
                  font-size: 34px; font-weight: 500; color: #aaa;
                  line-height: 1.6;
                }
                .footer {
                  display: flex; align-items: center; gap: 20px;
                  padding-top: 32px; border-top: 1px solid #333;
                }
                .footer .brand { font-size: 24px; color: #888; font-weight: 600; }
                .footer .swipe { margin-left: auto; font-size: 24px; color: #666; }
              </style>
            </head>
            <body>
              <div class="header-tag">CONTRAPONTO</div>
              <div class="content">
                <h1 class="headline">
                  usar muita IA tá <span class="highlight">fritando</span> teu cérebro
                </h1>
                <div class="accent-line"></div>
                <p class="body-text">
                  Harvard publicou estudo e deu nome pro efeito: brain fry. quem usa até 3 IAs simultâneas reportou menos cansaço, mais produtividade no dia a dia. o problema é quando tu passa desse número. o cérebro não aguenta gerenciar múltiplas assistências ao mesmo tempo.
                </p>
              </div>
              <div class="footer">
                <div class="brand">Innovation Latam</div>
                <div class="swipe">ARRASTE →</div>
              </div>
            </body>
            </html>
      anti_patterns:
        never_do:
          - "Usar dependências externas em HTML: sem CDN, sem JS externo, sem imagens hospedadas fora (exceção: Google Fonts via @import)"
          - "Design sem definir design system primeiro: causa inconsistência entre slides"
          - "Usar font sizes abaixo dos mínimos: 20px é piso absoluto, 58px hero para IG carousel"
          - "Usar absolute positioning para layout primário: use Grid ou Flexbox (absolute apenas para overlays decorativos)"
          - "Pular verificação de renderização: HTML pode parecer correto mas renderizar mal"
          - "Colocar texto em imagens sem proteção de contraste: exige overlay sólido ou gradiente"
          - "Usar mais de 5 cores no design system: cria ruído visual"
          - "Incluir contadores de slide: '7/8' ou '1/7' são redundantes (Instagram tem navegação nativa)"
        always_do:
          - "Começar todo design com documentação do design system antes de escrever HTML"
          - "Verificar slide 1 antes de batch rendering: previne retrabalho em todos os slides"
          - "Documentar rationale de design: explique escolhas visuais (cores, fontes, layout)"
          - "Viewport exato: body width e height devem corresponder exatamente às dimensões do browser"
      voice_guidance:
        always_use:
          - term: "design system"
            why: "Termo fundamental para identidade visual consistente"
          - term: "visual hierarchy"
            why: "Explica movimento do olho através do design"
          - term: "viewport: 1080x1440"
            why: "Sempre declare dimensões explicitamente"
          - term: "contrast ratio 4.5:1"
            why: "Referencia padrões WCAG ao justificar combinações de cores"
          - term: "self-contained HTML"
            why: "Constraint não-negociável"
          - term: "rendering verification"
            why: "Passo onde confirma visualmente o resultado"
        never_use:
          - term: "placeholder ou Lorem ipsum"
            why: "Todo elemento de texto deve conter conteúdo real do brief"
          - term: "aproximadamente para tamanhos"
            why: "Use valores exatos em pixels"
          - term: "genérico para escolhas de design"
            why: "Toda escolha deve ser justificada"
          - term: "em dashes"
            why: "Use pontos, dois-pontos ou quebras de linha"
        tone_rules:
          - "Precisão técnica: todas as dimensões, tamanhos e espaçamentos são valores exatos"
          - "Decisões documentadas: sempre explique o rationale por trás das escolhas visuais"
          - "Rationale explícito: justifique escolhas de cores, fontes, layout"
      quality_criteria:
        - "Design system documentado antes da criação de slides individuais"
        - "Todos os arquivos HTML são self-contained: CSS inline, sem dependências externas exceto Google Fonts @import"
        - "Todos os textos atendem tamanhos mínimos de fonte para a plataforma (verificado contra tabela de specs)"
        - "Todos os textos atendem WCAG AA contrast ratio de 4.5:1 contra o background"
        - "Dimensões do body correspondem exatamente ao viewport target (width e height em px)"
        - "CSS usa Grid ou Flexbox para layout (sem absolute positioning para estrutura primária)"
        - "Conteúdo multi-slide usa design system consistente em todos os slides (mesmas cores, fontes, espaçamento)"
        - "Primeiro slide foi renderizado e verificado visualmente antes de batch rendering"
        - "Sem texto placeholder (Lorem ipsum, 'Texto aqui', etc.) em qualquer entregável"
        - "Rationale de design documentado junto com o output"

