<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1440px;
      overflow: hidden;
      background: #1a1a1a;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      padding: 72px;
      position: relative;
    }
    
    /* Header tag */
    .header-tag {
      display: inline-block;
      background: #FFD700;
      color: #000;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    
    /* Main content area */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
    }
    
    /* Headline */
    .headline {
      font-size: 58px;
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
    }
    
    .headline .highlight {
      color: #FFD700;
    }
    
    /* Supporting text */
    .body-text {
      font-size: 34px;
      font-weight: 500;
      color: #bbb;
      line-height: 1.5;
    }
    
    /* Accent line */
    .accent-line {
      width: 80px;
      height: 4px;
      background: #FFD700;
      margin: 24px 0;
    }
    
    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-top: 32px;
      border-top: 1px solid #333;
    }
    
    .footer .brand {
      font-size: 24px;
      color: #888;
      font-weight: 600;
    }
    
    .footer .swipe {
      margin-left: auto;
      font-size: 24px;
      color: #666;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Header tag -->
  <div class="header-tag">TECH NEWS #01</div>
  
  <!-- Main content -->
  <div class="content">
    <h1 class="headline">
      IA agora escreve código <span class="highlight">melhor que devs júnior</span>
    </h1>
    
    <div class="accent-line"></div>
    
    <p class="body-text">
      Desenvolvedores que usam assistentes de IA economizam 18 horas por semana. Pesquisa com 10 mil devs mostra que a produtividade aumentou 67% em tarefas repetitivas.
    </p>
  </div>
  
  <!-- Footer -->
  <div class="footer">
    <div class="brand">Innovation Latam</div>
    <div class="swipe">ARRASTE →</div>
  </div>
</body>
</html>
