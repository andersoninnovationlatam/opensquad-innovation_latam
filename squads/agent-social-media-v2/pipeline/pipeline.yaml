name: "Pipeline — Social Media Innovation Latam v2"
version: "1.3.0"
squad: "agent-social-media-v2"

description: >
  Pipeline: input/content.md (notícia + angulo_escolhido obrigatório) → angles.yaml + copy → direção de arte (cenas por slide) → design HTML →
  execução obrigatória de generate-bg-image.mjs + inject-bg-and-render.mjs por slide (ou run-squad-design.mjs) → JPEG 1080×1350 em slides/v1/rendered/.
  Sem checkpoints obrigatórios. Para adicionar checkpoints: /opensquad edit agent-social-media-v2.

steps:
  - id: step-01
    name: "Registro de Ângulos (ângulo do usuário)"
    type: agent
    agent: carlos-conteudo
    execution: inline
    file: steps/step-01-generate-angles.md

  - id: step-02
    name: "Criação dos Slides (Copy)"
    type: agent
    agent: carlos-conteudo
    execution: inline
    file: steps/step-02-create-slides.md
    depends_on: step-01

  - id: step-03
    name: "Daniel Diretor — Cenas"
    type: agent
    agent: daniel-diretor
    execution: inline
    file: steps/step-03-art-direction.md
    depends_on: step-02

  - id: step-04
    name: "Design dos Slides (HTML)"
    type: agent
    agent: daria-design
    execution: inline
    file: steps/step-04-design-slides.md
    depends_on: step-03

  - id: step-05
    name: "Renderização dos Slides (PNG)"
    type: agent
    agent: daria-design
    execution: inline
    file: steps/step-05-render-slides.md
    depends_on: step-04

  - id: step-06
    name: "Publicação no Instagram"
    type: agent
    agent: daria-design
    execution: inline
    file: steps/step-06-publish-instagram.md
    depends_on: step-05
    checkpoint: true

output:
  artifacts:
    - output/angles.yaml
    - output/carousel-draft.md
    - output/slide-scenes.md
    - output/slides/
    - output/slides/rendered/
    - output/publish-result.md
