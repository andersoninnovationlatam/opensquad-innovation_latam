name: "Instagram Carrossel — Innovation Latam"
version: "1.0"
description: "Pipeline de criação de carrosseis: pesquisa → ângulos → copy → design → revisão"

steps:
  - step: 1
    name: "research-focus"
    file: steps/step-01-research-focus.md
    type: checkpoint
  - step: 2
    name: "find-and-rank-news"
    file: steps/step-02-find-and-rank-news.md
    type: agent
    agent: rodrigo-radar
  - step: 3
    name: "news-selection"
    file: steps/step-03-news-selection.md
    type: checkpoint
  - step: 4
    name: "generate-angles"
    file: steps/step-04-generate-angles.md
    type: agent
    agent: carlos-carrossel
  - step: 5
    name: "angle-selection"
    file: steps/step-05-angle-selection.md
    type: checkpoint
  - step: 6
    name: "create-carousel"
    file: steps/step-06-create-carousel.md
    type: agent
    agent: carlos-carrossel
  - step: 7
    name: "content-approval"
    file: steps/step-07-content-approval.md
    type: checkpoint
  - step: 8
    name: "design-slides"
    file: steps/step-08-design-slides.md
    type: agent
    agent: beatriz-briefing
  - step: 9
    name: "design-approval"
    file: steps/step-09-design-approval.md
    type: checkpoint
  - step: 10
    name: "render-slides"
    file: steps/step-10-render-slides.md
    type: agent
    agent: beatriz-briefing
  - step: 11
    name: "review"
    file: steps/step-11-review.md
    type: agent
    agent: vera-veredito
  - step: 12
    name: "final-approval"
    file: steps/step-12-final-approval.md
    type: checkpoint

checkpoints:
  - step-01-research-focus
  - step-03-news-selection
  - step-05-angle-selection
  - step-07-content-approval
  - step-09-design-approval
  - step-12-final-approval

on_reject:
  step: 6
  trigger: step-11-review
  description: "Se Vera Veredito emitir REJEITAR, retornar ao Passo 6 (create-carousel) com feedback de review.md"
